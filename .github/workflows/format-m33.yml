name: Format M33

on:
  push:
    branches:
      - feat/level4-whole-machine-ux
    paths:
      - .github/workflows/format-m33.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-whole-machine-ux
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - run: pnpm prettier --write docs/guide/windows-companion-ui.md docs/architecture/decisions/0022-explicit-whole-machine-companion-ux.md
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/ui.rs apps/windows-companion/src/machine.rs apps/windows-companion/src/protocol.rs docs/guide/windows-companion-ui.md docs/architecture/decisions/0022-explicit-whole-machine-companion-ux.md
          git diff --cached --quiet || git commit -m "style: format M33 docs"
          git push origin HEAD:feat/level4-whole-machine-ux
