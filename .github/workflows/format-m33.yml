name: Format M33
# rerun after terminal-state UX fix

on:
  push:
    branches:
      - feat/level4-whole-machine-ux
    paths:
      - .github/workflows/format-m33.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-whole-machine-ux
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/ui.rs apps/windows-companion/src/machine.rs apps/windows-companion/src/protocol.rs
          git diff --cached --quiet || git commit -m "style: format M33 implementation"
          git push origin HEAD:feat/level4-whole-machine-ux
