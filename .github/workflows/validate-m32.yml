name: Validate M32
# rerun after TypeScript outcome fix

on:
  push:
    branches:
      - feat/level4-coordinated-restore
    paths:
      - .github/workflows/validate-m32.yml

permissions:
  contents: read

jobs:
  webextension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordinated-restore
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check

  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordinated-restore
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/windows-companion/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/windows-companion/Cargo.toml --locked
