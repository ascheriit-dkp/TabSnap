name: M23 format

on:
  push:
    branches:
      - feat/chromium-runtime
    paths:
      - .github/workflows/m23-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/chromium-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Format Chromium changes
        run: pnpm exec prettier --write apps/chrome-extension/src/browser.ts apps/chrome-extension/src/browser.test.ts apps/chrome-extension/src/chromium-runtime.ts apps/chrome-extension/src/chromium-runtime.test.ts ROADMAP.md docs/architecture/decisions/0013-chromium-runtime.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/browser.ts apps/chrome-extension/src/browser.test.ts apps/chrome-extension/src/chromium-runtime.ts apps/chrome-extension/src/chromium-runtime.test.ts ROADMAP.md docs/architecture/decisions/0013-chromium-runtime.md
          git commit -m "style: format Chromium runtime changes"
          git push origin HEAD:feat/chromium-runtime
