name: Fix M30 Review

on:
  push:
    branches:
      - feat/level4-coordinated-capture
    paths:
      - .github/workflows/fix-m30-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordinated-capture
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: python .github/scripts/fix-m30-review.py
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - run: cargo clippy --manifest-path apps/windows-companion/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/windows-companion/Cargo.toml --locked
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/capture.rs
          git commit -m "fix: preserve terminal capture result semantics"
          git push origin HEAD:feat/level4-coordinated-capture
