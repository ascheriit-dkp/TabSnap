name: M28 format

on:
  push:
    branches:
      - chore/store-readiness
    paths:
      - .github/workflows/m28-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/store-readiness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/chrome-extension/src/companion-consent.ts apps/chrome-extension/src/companion-consent.test.ts scripts/audit-store-readiness.mjs
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/companion-consent.ts apps/chrome-extension/src/companion-consent.test.ts scripts/audit-store-readiness.mjs
          git commit -m "style: format store readiness changes"
          git push origin HEAD:chore/store-readiness
