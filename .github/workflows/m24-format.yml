name: M24 format

on:
  push:
    branches:
      - feat/edge-support
    paths:
      - .github/workflows/m24-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/edge-support
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write scripts/audit-edge-package.mjs tests/browser/edge-compat.e2e.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-edge-package.mjs tests/browser/edge-compat.e2e.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Edge support files"
          git push origin HEAD:feat/edge-support
