name: Fix M29 lint

on:
  push:
    branches:
      - feat/level4-coordination-foundation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordination-foundation
      - name: Replace empty interface
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/chrome-extension/src/companion.ts')
          text = path.read_text()
          old = 'export interface CompanionBrowserEntry extends CompanionBrowserRegistration {}\n'
          new = 'export type CompanionBrowserEntry = CompanionBrowserRegistration;\n'
          if text.count(old) != 1:
              raise SystemExit('expected one empty interface')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/companion.ts
          git commit -m "fix: use coordination type alias"
          git push origin HEAD:feat/level4-coordination-foundation
