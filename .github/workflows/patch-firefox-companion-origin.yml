name: Patch Firefox companion origin

on:
  push:
    branches:
      - fix/firefox-companion-origin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/firefox-companion-origin
      - name: Patch protocol and tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/windows-companion/src/protocol.rs')
          text = path.read_text()

          replacements = [
              (
                  'const CHROME_EXTENSION_PREFIX: &str = "chrome-extension://";\n',
                  'const CHROME_EXTENSION_PREFIX: &str = "chrome-extension://";\nconst FIREFOX_EXTENSION_PREFIX: &str = "moz-extension://";\n',
              ),
              (
                  'Some(origin) if valid_chrome_extension_origin(origin) => Some(origin.to_owned()),',
                  'Some(origin) if valid_extension_origin(origin) => Some(origin.to_owned()),',
              ),
              (
                  '''fn valid_chrome_extension_origin(origin: &str) -> bool {\n    let Some(id) = origin.strip_prefix(CHROME_EXTENSION_PREFIX) else {\n        return false;\n    };\n    id.len() == 32 && id.bytes().all(|byte| matches!(byte, b'a'..=b'p'))\n}\n''',
                  '''fn valid_extension_origin(origin: &str) -> bool {\n    valid_chromium_extension_origin(origin) || valid_firefox_extension_origin(origin)\n}\n\nfn valid_chromium_extension_origin(origin: &str) -> bool {\n    let Some(id) = origin.strip_prefix(CHROME_EXTENSION_PREFIX) else {\n        return false;\n    };\n    id.len() == 32 && id.bytes().all(|byte| matches!(byte, b'a'..=b'p'))\n}\n\nfn valid_firefox_extension_origin(origin: &str) -> bool {\n    let Some(id) = origin.strip_prefix(FIREFOX_EXTENSION_PREFIX) else {\n        return false;\n    };\n    let bytes = id.as_bytes();\n    if bytes.len() != 36 {\n        return false;\n    }\n\n    bytes.iter().enumerate().all(|(index, byte)| {\n        if matches!(index, 8 | 13 | 18 | 23) {\n            *byte == b'-'\n        } else {\n            matches!(*byte, b'0'..=b'9' | b'a'..=b'f')\n        }\n    })\n}\n''',
              ),
              (
                  'const EXTENSION_ORIGIN: &str = "chrome-extension://abcdefghijklmnopabcdefghijklmnop";\n',
                  'const EXTENSION_ORIGIN: &str = "chrome-extension://abcdefghijklmnopabcdefghijklmnop";\n    const FIREFOX_EXTENSION_ORIGIN: &str =\n        "moz-extension://944cfddf-7a95-3c47-bd9a-663b3ce8d699";\n',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old[:80]!r}')
              text = text.replace(old, new)

          anchor = '''    #[test]\n    fn stores_lists_and_loads_opaque_snapshot_over_loopback() {\n'''
          test = '''    #[test]\n    fn supports_firefox_extension_preflight() {\n        let (server, root) = test_server("firefox-preflight");\n        let address = server.local_addr().unwrap();\n        let worker = thread::spawn(move || server.serve_n(1).unwrap());\n        let request_text = format!(\n            "OPTIONS /v1/status HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nOrigin: {FIREFOX_EXTENSION_ORIGIN}\\r\\nAccess-Control-Request-Method: GET\\r\\nConnection: close\\r\\n\\r\\n"\n        );\n\n        let response = request(address, request_text.as_bytes());\n        let response_text = String::from_utf8(response).unwrap();\n\n        assert!(response_text.starts_with("HTTP/1.1 204 No Content\\r\\n"));\n        assert!(response_text.contains(&format!(\n            "Access-Control-Allow-Origin: {FIREFOX_EXTENSION_ORIGIN}\\r\\n"\n        )));\n        worker.join().unwrap();\n        if root.exists() {\n            fs::remove_dir_all(root).unwrap();\n        }\n    }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor missing or duplicated')
          text = text.replace(anchor, test + anchor)

          path.write_text(text)
      - name: Format
        run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/protocol.rs
          git commit -m "fix: allow Firefox companion origin"
          git push origin HEAD:fix/firefox-companion-origin
