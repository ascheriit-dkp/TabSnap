name: M23 Chromium refactor

on:
  push:
    branches:
      - feat/chromium-runtime
    paths:
      - .github/workflows/m23-chromium-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/chromium-runtime
      - name: Apply Chromium runtime refactor
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/chrome-extension/src/browser.ts')
          text = path.read_text()
          marker = "} from '@tabsnap/schema';\n"
          text = text.replace(marker, marker + "\nimport { detectChromiumRuntime } from './chromium-runtime.js';\n", 1)
          text = text.replace("  'devtools:',\n", "  'devtools:',\n  'edge-extension:',\n", 1)
          text = text.replace('CHROME_GROUP_COLORS', 'CHROMIUM_GROUP_COLORS')
          text = text.replace('platformFromChrome', 'platformFromChromium')
          text = text.replace('chromeGroupColor', 'chromiumGroupColor')
          text = text.replace("throw new Error('Chrome returned a window without an ID.');", "throw new Error('Chromium API returned a window without an ID.');")
          text = text.replace("throw new Error('Chrome returned an empty normal window.');", "throw new Error('Chromium API returned an empty normal window.');")
          text = text.replace("      if (createdTab.id === undefined) throw new Error('Chrome returned a tab without an ID.');", "      if (createdTab.id === undefined) throw new Error('Chromium API returned a tab without an ID.');")
          text = text.replace("error instanceof Error ? error.message : 'Chrome rejected the tab.'", "error instanceof Error ? error.message : 'browser rejected the tab.'")
          old_version = "function browserVersion(): string | undefined {\n  return /(?:Chrome|Chromium)\\/([0-9.]+)/u.exec(navigator.userAgent)?.[1];\n}\n\n"
          if old_version not in text:
              raise SystemExit('browserVersion block not found')
          text = text.replace(old_version, '', 1)
          old_capture = "export async function captureWorkspace(): Promise<TabSnapSnapshot> {\n  const [windows, platformInfo] = await Promise.all(["
          new_capture = "export async function captureWorkspace(): Promise<TabSnapSnapshot> {\n  const runtime = detectChromiumRuntime(navigator.userAgent);\n  const [windows, platformInfo] = await Promise.all(["
          if old_capture not in text:
              raise SystemExit('captureWorkspace marker not found')
          text = text.replace(old_capture, new_capture, 1)
          text = text.replace("  if (windows.length === 0) throw new Error('No normal Chrome windows are available to capture.');\n\n  const version = browserVersion();", "  if (windows.length === 0) {\n    throw new Error(`No normal ${runtime.displayName} windows are available to capture.`);\n  }")
          text = text.replace("      browser: 'chrome',", "      browser: runtime.browser,", 1)
          text = text.replace("      ...(version !== undefined ? { browserVersion: version } : {}),", "      ...(runtime.version !== undefined ? { browserVersion: runtime.version } : {}),", 1)
          path.write_text(text)
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/browser.ts
          git commit -m "refactor: generalize browser adapter for Chromium"
          git push origin HEAD:feat/chromium-runtime
