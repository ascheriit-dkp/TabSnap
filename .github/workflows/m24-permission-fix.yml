name: M24 permission fix

on:
  push:
    branches:
      - feat/edge-support
    paths:
      - .github/workflows/m24-permission-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/edge-support
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Handle manifest-granted loopback permission
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/chrome-extension/src/main.ts')
          text = path.read_text()
          old = """async function hasCompanionOriginPermission(): Promise<boolean> {\n  return new Promise((resolvePermission) => {\n    chrome.permissions.contains({ origins: [COMPANION_ORIGIN_PERMISSION] }, resolvePermission);\n  });\n}\n"""
          new = """async function hasCompanionOriginPermission(): Promise<boolean> {\n  const requiredOrigins = chrome.runtime.getManifest().host_permissions ?? [];\n  if (requiredOrigins.includes(COMPANION_ORIGIN_PERMISSION)) return true;\n\n  return new Promise((resolvePermission) => {\n    chrome.permissions.contains({ origins: [COMPANION_ORIGIN_PERMISSION] }, resolvePermission);\n  });\n}\n"""
          if old not in text:
              raise SystemExit('permission helper not found')
          path.write_text(text.replace(old, new, 1))
      - run: pnpm exec prettier --write apps/chrome-extension/src/main.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/main.ts
          git commit -m "fix: recognize manifest-granted companion origin"
          git push origin HEAD:feat/edge-support
