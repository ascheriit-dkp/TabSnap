name: Patch M31 Container

on:
  push:
    branches:
      - feat/level4-machine-snapshot-container
    paths:
      - .github/workflows/patch-m31-container.yml
      - .github/scripts/patch-m31-container.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-machine-snapshot-container
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: python .github/scripts/patch-m31-container.py
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - run: cargo clippy --manifest-path apps/windows-companion/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/windows-companion/Cargo.toml --locked
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/capture.rs apps/windows-companion/src/coordination.rs apps/windows-companion/src/machine.rs apps/windows-companion/src/protocol.rs apps/windows-companion/src/main.rs
          git commit -m "feat: persist coordinated capture as machine snapshot"
          git push origin HEAD:feat/level4-machine-snapshot-container
