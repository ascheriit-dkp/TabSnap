name: Format M30 ADR

on:
  push:
    branches:
      - feat/level4-coordinated-capture
    paths:
      - .github/workflows/format-m30-adr.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordinated-capture
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm prettier --write docs/architecture/decisions/0019-ephemeral-coordinated-capture.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/decisions/0019-ephemeral-coordinated-capture.md
          git commit -m "style: format M30 ADR"
          git push origin HEAD:feat/level4-coordinated-capture
