name: Format Windows companion

on:
  push:
    branches:
      - feat/windows-local-protocol
    paths:
      - apps/windows-companion/src/protocol.rs
      - .github/workflows/format-windows-companion.yml

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/windows-local-protocol
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
      - name: Format
        run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- apps/windows-companion/src/protocol.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/protocol.rs
          git commit -m "style: apply rustfmt to local protocol"
          git push origin HEAD:feat/windows-local-protocol
