name: Patch M29 coordination protocol

on:
  push:
    branches:
      - feat/level4-coordination-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordination-foundation
      - name: Patch
        run: python scripts/patch-m29.py
      - name: Format Rust
        run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - name: Commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src apps/chrome-extension/src
          git commit -m "feat: connect extension browser presence"
          git push origin HEAD:feat/level4-coordination-foundation
