name: Release

on:
  push:
    tags:
      - 'v*'
  create:

permissions:
  contents: write

jobs:
  windows-companion:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-trigger/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'create') {
            $tag = '${{ github.event.ref }}'
            $tag = $tag -replace '^release-trigger/', ''
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if (-not $tag.StartsWith('v')) { throw "Release tag must start with v: $tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
      - name: Validate companion version
        shell: pwsh
        run: |
          $cargo = Get-Content apps/windows-companion/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version = "([^\"]+)"') { throw 'Cannot read companion version' }
          if ($Matches[1] -ne $env:RELEASE_VERSION) {
            throw "Companion version $($Matches[1]) does not match release $env:RELEASE_VERSION"
          }
      - name: Build companion
        run: cargo build --manifest-path apps/windows-companion/Cargo.toml --locked --release
      - name: Smoke-test companion
        shell: pwsh
        run: ./scripts/test-windows-companion.ps1
      - name: Package companion
        shell: pwsh
        run: ./scripts/package-windows-companion.ps1 -Version $env:RELEASE_TAG -OutputDirectory "$env:GITHUB_WORKSPACE\dist"
      - uses: actions/upload-artifact@v4
        with:
          name: tabsnap-companion-release
          path: |
            dist/tabsnap-companion-windows-x64-*.zip
            dist/tabsnap-companion-windows-x64-*.zip.sha256
          if-no-files-found: error

  release:
    needs: windows-companion
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-trigger/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "create" ]]; then
            RELEASE_TAG="${{ github.event.ref }}"
            RELEASE_TAG="${RELEASE_TAG#release-trigger/}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - run: pnpm install --no-frozen-lockfile
      - name: Validate release version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const expected=process.env.RELEASE_VERSION; const root=JSON.parse(fs.readFileSync('package.json','utf8')); const app=JSON.parse(fs.readFileSync('apps/chrome-extension/package.json','utf8')); const manifest=JSON.parse(fs.readFileSync('apps/chrome-extension/public/manifest.json','utf8')); if(root.version!==expected || app.version!==expected || manifest.version_name!==expected) throw new Error('Release tag does not match package/manifest version_name');"
      - run: pnpm check
      - name: Package Chrome extension
        run: |
          CHROME_ARCHIVE="tabsnap-chrome-${RELEASE_TAG}.zip"
          echo "CHROME_ARCHIVE=$CHROME_ARCHIVE" >> "$GITHUB_ENV"
          cd apps/chrome-extension/dist
          find . -type f -exec touch -t 198001010000 {} +
          find . -type f -print0 | sort -z | xargs -0 zip -X "$GITHUB_WORKSPACE/$CHROME_ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$CHROME_ARCHIVE" > "$CHROME_ARCHIVE.sha256"
      - name: Package Microsoft Edge extension
        run: |
          pnpm extension:edge-audit
          EDGE_ARCHIVE="tabsnap-edge-${RELEASE_TAG}.zip"
          echo "EDGE_ARCHIVE=$EDGE_ARCHIVE" >> "$GITHUB_ENV"
          cd apps/chrome-extension/dist
          find . -type f -exec touch -t 198001010000 {} +
          find . -type f -print0 | sort -z | xargs -0 zip -X "$GITHUB_WORKSPACE/$EDGE_ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$EDGE_ARCHIVE" > "$EDGE_ARCHIVE.sha256"
      - uses: actions/download-artifact@v5
        with:
          name: tabsnap-companion-release
          path: companion-release
      - name: Create release tag
        if: github.event_name == 'create'
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $EXISTING_SHA instead of $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG}.md"
          COMPANION_ARCHIVE="$(find companion-release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          COMPANION_CHECKSUM="${COMPANION_ARCHIVE}.sha256"
          if [[ ! -f "$COMPANION_ARCHIVE" || ! -f "$COMPANION_CHECKSUM" ]]; then
            echo 'Companion release assets are missing.' >&2
            exit 1
          fi

          ASSETS=(
            "$CHROME_ARCHIVE"
            "$CHROME_ARCHIVE.sha256"
            "$EDGE_ARCHIVE"
            "$EDGE_ARCHIVE.sha256"
            "$COMPANION_ARCHIVE"
            "$COMPANION_CHECKSUM"
          )
          if [[ -f "$NOTES" ]]; then
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "TabSnap ${RELEASE_TAG}" \
              --prerelease \
              --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "TabSnap ${RELEASE_TAG}" \
              --prerelease \
              --generate-notes
          fi
