name: Format M29

on:
  push:
    branches:
      - feat/level4-coordination-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-coordination-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm prettier --write apps/chrome-extension/src/companion.test.ts apps/chrome-extension/src/companion.ts apps/chrome-extension/src/main.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/companion.test.ts apps/chrome-extension/src/companion.ts apps/chrome-extension/src/main.ts
          git commit -m "style: format M29 coordination code"
          git push origin HEAD:feat/level4-coordination-foundation
