name: Validate M33

on:
  push:
    branches:
      - feat/level4-whole-machine-ux
    paths:
      - .github/workflows/validate-m33.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-whole-machine-ux
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/windows-companion/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/windows-companion/Cargo.toml --locked
      - run: cargo build --manifest-path apps/windows-companion/Cargo.toml --locked --release
