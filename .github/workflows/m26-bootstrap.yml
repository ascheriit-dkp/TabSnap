name: M26 bootstrap

on:
  push:
    branches:
      - feat/firefox-adapter
    paths:
      - .github/workflows/m26-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/firefox-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add -Dw web-ext@10.6.0
      - name: Format M26 files
        run: |
          pnpm exec prettier --write \
            .github/workflows/ci.yml \
            apps/chrome-extension/firefox-manifest.json \
            apps/chrome-extension/src/browser.ts \
            apps/chrome-extension/src/browser.test.ts \
            apps/chrome-extension/src/chromium-adapter.ts \
            apps/chrome-extension/src/firefox-adapter.ts \
            apps/chrome-extension/src/firefox-runtime.ts \
            apps/chrome-extension/src/firefox-runtime.test.ts \
            apps/chrome-extension/src/webextension-adapter.ts \
            package.json \
            scripts/audit-firefox-package.mjs \
            scripts/build-firefox-package.mjs
      - name: Commit tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/m26-bootstrap.yml'
          git commit -m "build: add Firefox packaging toolchain"
          git push origin HEAD:feat/firefox-adapter
