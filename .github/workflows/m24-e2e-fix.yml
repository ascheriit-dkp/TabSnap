name: M24 E2E fix

on:
  push:
    branches:
      - feat/edge-support
    paths:
      - .github/workflows/m24-e2e-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/edge-support
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Patch companion permission flow and Edge E2E harness
        shell: python
        run: |
          from pathlib import Path

          main = Path('apps/chrome-extension/src/main.ts')
          text = main.read_text()
          marker = "async function run(action: string, operation: () => Promise<void>): Promise<void> {"
          helper = """async function hasCompanionOriginPermission(): Promise<boolean> {\n  return new Promise((resolvePermission) => {\n    chrome.permissions.contains({ origins: [COMPANION_ORIGIN_PERMISSION] }, resolvePermission);\n  });\n}\n\n"""
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)
          old = """    const pairing = parseCompanionPairingCode(companionPairing.value);\n    const granted = await chrome.permissions.request({ origins: [COMPANION_ORIGIN_PERMISSION] });\n    if (!granted) throw new Error('Loopback permission was not granted. Companion mode stays off.');\n"""
          new = """    const pairing = parseCompanionPairingCode(companionPairing.value);\n    const alreadyGranted = await hasCompanionOriginPermission();\n    const granted =\n      alreadyGranted ||\n      (await chrome.permissions.request({ origins: [COMPANION_ORIGIN_PERMISSION] }));\n    if (!granted) throw new Error('Loopback permission was not granted. Companion mode stays off.');\n"""
          if old not in text:
              raise SystemExit('companion connect block not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          edge = Path('tests/browser/edge-compat.e2e.ts')
          text = edge.read_text()
          text = text.replace(
              "import { createServer, type IncomingMessage, type Server, type ServerResponse } from 'node:http';\nimport { type AddressInfo } from 'node:net';\nimport { resolve } from 'node:path';",
              "import { cp, mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';\nimport { createServer, type IncomingMessage, type Server, type ServerResponse } from 'node:http';\nimport { type AddressInfo } from 'node:net';\nimport { tmpdir } from 'node:os';\nimport { join, resolve } from 'node:path';",
          )
          marker = "function companionServer(): Server {"
          helper = """async function stageEdgeExtensionWithPregrantedLoopback(): Promise<{\n  root: string;\n  extensionPath: string;\n}> {\n  const root = await mkdtemp(join(tmpdir(), 'tabsnap-edge-e2e-'));\n  const extensionPath = join(root, 'extension');\n  await cp(resolve('apps/chrome-extension/dist'), extensionPath, { recursive: true });\n\n  const manifestPath = join(extensionPath, 'manifest.json');\n  const manifest = JSON.parse(await readFile(manifestPath, 'utf8')) as Record<string, unknown>;\n  manifest.host_permissions = ['http://127.0.0.1/*'];\n  delete manifest.optional_host_permissions;\n  await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\\n`);\n\n  return { root, extensionPath };\n}\n\n"""
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "  const fixtureUrl = `http://127.0.0.1:${fixturePort}/edge`;\n  const extensionPath = resolve('apps/chrome-extension/dist');\n\n  const context = await chromium.launchPersistentContext('', {",
              "  const fixtureUrl = `http://127.0.0.1:${fixturePort}/edge`;\n  const stagedExtension = await stageEdgeExtensionWithPregrantedLoopback();\n\n  const context = await chromium.launchPersistentContext('', {",
          )
          text = text.replace(
              "args: [`--disable-extensions-except=${extensionPath}`, `--load-extension=${extensionPath}`],",
              "args: [\n      `--disable-extensions-except=${stagedExtension.extensionPath}`,\n      `--load-extension=${stagedExtension.extensionPath}`,\n    ],",
              1,
          )
          text = text.replace(
              "    await closeServer(companion);\n    await closeServer(fixtureServer);\n  }\n});",
              "    await closeServer(companion);\n    await closeServer(fixtureServer);\n    await rm(stagedExtension.root, { recursive: true, force: true });\n  }\n});",
              1,
          )
          edge.write_text(text)
      - run: pnpm exec prettier --write apps/chrome-extension/src/main.ts tests/browser/edge-compat.e2e.ts
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chrome-extension/src/main.ts tests/browser/edge-compat.e2e.ts
          git commit -m "test: pregrant loopback only in Edge E2E harness"
          git push origin HEAD:feat/edge-support
