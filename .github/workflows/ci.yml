name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: git diff -- packages/crypto/src/index.ts packages/crypto/src/index.test.ts
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm docs:build
