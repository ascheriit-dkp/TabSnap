name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check

  browser-integration:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm extension:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm extension:e2e

  edge-package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm extension:build
      - run: pnpm extension:edge-audit
      - name: Package Edge extension
        run: |
          ARCHIVE="tabsnap-edge-ci-${GITHUB_SHA}.zip"
          cd apps/chrome-extension/dist
          find . -type f -exec touch -t 198001010000 {} +
          find . -type f -print0 | sort -z | xargs -0 zip -X "$GITHUB_WORKSPACE/$ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tabsnap-edge-package
          path: |
            tabsnap-edge-ci-*.zip
            tabsnap-edge-ci-*.zip.sha256
          if-no-files-found: error

  firefox-package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm extension:build
      - run: pnpm extension:firefox-build
      - run: pnpm extension:firefox-audit
      - run: pnpm extension:firefox-lint
      - name: Package Firefox extension
        run: |
          ARCHIVE="tabsnap-firefox-ci-${GITHUB_SHA}.zip"
          cd apps/chrome-extension/dist-firefox
          find . -type f -exec touch -t 198001010000 {} +
          find . -type f -print0 | sort -z | xargs -0 zip -X "$GITHUB_WORKSPACE/$ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tabsnap-firefox-package
          path: |
            tabsnap-firefox-ci-*.zip
            tabsnap-firefox-ci-*.zip.sha256
          if-no-files-found: error

  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/windows-companion/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/windows-companion/Cargo.toml --locked
      - name: Build portable executable
        run: cargo build --manifest-path apps/windows-companion/Cargo.toml --locked --release
      - name: Smoke-test portable executable
        shell: pwsh
        run: ./scripts/test-windows-companion.ps1
      - name: Package portable companion
        shell: pwsh
        run: ./scripts/package-windows-companion.ps1 -Version "ci-$env:GITHUB_SHA" -OutputDirectory "$env:GITHUB_WORKSPACE\dist"
      - uses: actions/upload-artifact@v4
        with:
          name: tabsnap-companion-windows-x64
          path: |
            apps/windows-companion/target/release/tabsnap-companion.exe
            dist/tabsnap-companion-windows-x64-*.zip
            dist/tabsnap-companion-windows-x64-*.zip.sha256
          if-no-files-found: error
