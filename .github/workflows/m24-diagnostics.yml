name: M24 diagnostics

on:
  push:
    branches:
      - feat/edge-support
    paths:
      - .github/workflows/m24-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/edge-support
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Improve Edge connection diagnostics
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/browser/edge-compat.e2e.ts')
          text = path.read_text()
          old = """    await expect(extensionPage.locator('#companion-state')).toHaveText('Connected');\n    await expect(extensionPage.locator('#status')).toContainText(\n      'Portable companion connected for this page session.',\n    );\n"""
          new = """    await expect\n      .poll(\n        () =>\n          extensionPage.evaluate(async () => {\n            const state = document.getElementById('companion-state')?.textContent ?? '';\n            const status = document.getElementById('status')?.textContent ?? '';\n            const permissions = await new Promise<chrome.permissions.Permissions>(\n              (resolvePermissions) => chrome.permissions.getAll(resolvePermissions),\n            );\n            return { state, status, origins: permissions.origins ?? [] };\n          }),\n        { timeout: 5_000 },\n      )\n      .toMatchObject({\n        state: 'Connected',\n        status: expect.stringContaining('Portable companion connected for this page session.'),\n      });\n"""
          if old not in text:
              raise SystemExit('connection assertions not found')
          path.write_text(text.replace(old, new, 1))
      - run: pnpm exec prettier --write tests/browser/edge-compat.e2e.ts
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/edge-compat.e2e.ts
          git commit -m "test: report Edge companion connection diagnostics"
          git push origin HEAD:feat/edge-support
