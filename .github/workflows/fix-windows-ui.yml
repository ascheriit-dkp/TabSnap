name: Fix Windows UI

on:
  push:
    branches:
      - feat/windows-companion-ui
    paths:
      - .github/workflows/fix-windows-ui.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/windows-companion-ui
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/windows-companion/src/ui.rs')
          text = path.read_text()
          text = text.replace('    use std::fs;\n', '')
          text = text.replace('    fn child(\n', '    #[allow(clippy::too_many_arguments)]\n    fn child(\n', 1)
          text = text.replace('                PostQuitMessage(0);', '                unsafe { PostQuitMessage(0) };')
          text = text.replace('            _ => DefWindowProcW(hwnd, message_id, w_param, l_param),', '            _ => unsafe { DefWindowProcW(hwnd, message_id, w_param, l_param) },')
          path.write_text(text)
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
      - name: Format
        run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows-companion/src/ui.rs
          git commit -m "fix: satisfy strict Windows UI lints"
          git push origin HEAD:feat/windows-companion-ui
