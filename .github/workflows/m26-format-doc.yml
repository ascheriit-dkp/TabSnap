name: M26 format docs

on:
  push:
    branches:
      - feat/firefox-adapter
    paths:
      - .github/workflows/m26-format-doc.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/firefox-adapter
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write docs/technical/firefox-compatibility.md
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/technical/firefox-compatibility.md
          git commit -m "style: format Firefox compatibility docs"
          git push origin HEAD:feat/firefox-adapter
