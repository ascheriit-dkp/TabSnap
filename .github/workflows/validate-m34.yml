name: Validate M34 Hardening

on:
  push:
    branches:
      - feat/level4-hardening
    paths:
      - .github/workflows/validate-m34.yml

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Validate prerelease versions
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const expected='0.4.0-alpha.1'; const root=JSON.parse(fs.readFileSync('package.json','utf8')); const app=JSON.parse(fs.readFileSync('apps/chrome-extension/package.json','utf8')); const chromium=JSON.parse(fs.readFileSync('apps/chrome-extension/public/manifest.json','utf8')); const firefox=JSON.parse(fs.readFileSync('apps/chrome-extension/firefox-manifest.json','utf8')); if(root.version!==expected || app.version!==expected || chromium.version_name!==expected || firefox.version_name!==expected) throw new Error('M34 prerelease versions are inconsistent');"
      - run: pnpm check

  windows-hardening:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-hardening
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/windows-companion/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/windows-companion/Cargo.toml --locked
      - run: cargo build --manifest-path apps/windows-companion/Cargo.toml --locked --release
      - name: Smoke-test companion
        shell: pwsh
        run: ./scripts/test-windows-companion.ps1
      - name: Package companion
        shell: pwsh
        run: ./scripts/package-windows-companion.ps1 -Version v0.4.0-alpha.1 -OutputDirectory "$env:GITHUB_WORKSPACE\dist"
      - name: Verify portable package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/tabsnap-companion-windows-x64-v0.4.0-alpha.1.zip)) { throw 'Companion ZIP missing' }
          if (-not (Test-Path dist/tabsnap-companion-windows-x64-v0.4.0-alpha.1.zip.sha256)) { throw 'Companion checksum missing' }
