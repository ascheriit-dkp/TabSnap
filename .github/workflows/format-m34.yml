name: Format M34

on:
  push:
    branches:
      - feat/level4-hardening
    paths:
      - .github/workflows/format-m34.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/level4-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
      - run: cargo fmt --manifest-path apps/windows-companion/Cargo.toml
      - run: >-
          pnpm prettier --write
          README.md
          ROADMAP.md
          docs/privacy.md
          docs/security/threat-model.md
          docs/security/level4-readiness.md
          docs/releases/v0.4.0-alpha.1.md
          package.json
          apps/chrome-extension/package.json
          apps/chrome-extension/public/manifest.json
          apps/chrome-extension/firefox-manifest.json
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             README.md             ROADMAP.md             docs/privacy.md             docs/security/threat-model.md             docs/security/level4-readiness.md             docs/releases/v0.4.0-alpha.1.md             package.json             apps/chrome-extension/package.json             apps/chrome-extension/public/manifest.json             apps/chrome-extension/firefox-manifest.json             apps/windows-companion/src/capture.rs             apps/windows-companion/src/restore.rs             apps/windows-companion/src/machine.rs             apps/windows-companion/src/protocol.rs
          git diff --cached --quiet || git commit -m "style: format M34 release candidate"
          git push origin HEAD:feat/level4-hardening
